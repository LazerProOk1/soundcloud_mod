name: Идея
description: Чего не хватает или что сделать удобнее
title: '[Идея] '
labels: [enhancement]
assignees: [LazerProOk1]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо! Посмотрите, нет ли такой идеи в issues — тогда поставьте ей 👍, так видно,
        что нужнее.
  - type: textarea
    id: idea
    attributes:
      label: Идея
      description: Что хотите видеть в приложении. Хватит пары строк.
      placeholder: Например, «показывать текст песни в мини-плеере».
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Зачем
      description: Как вы будете этим пользоваться. Необязательно, но помогает сделать как надо.
  - type: textarea
    id: extra
    attributes:
      label: Пример, скриншот, ссылка
      description: Как это сделано в другом приложении, набросок, что угодно.
