name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.job_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
            job_name: windows
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage,rpm"
            job_name: ubuntu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: matrix.job_name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            rpm \
            squashfs-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-${{ matrix.job_name }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      # The tag is the version: tauri.conf.json reads it from package.json.
      - name: Take version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          jq --arg v "${GITHUB_REF_NAME#v}" '.version = $v' desktop/package.json > pkg.tmp
          mv pkg.tmp desktop/package.json

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Package Windows Portable ZIP
        if: matrix.job_name == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $portableDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          $exe = Get-ChildItem -Path "desktop/src-tauri/target/release" -Filter "*.exe" |
            Where-Object { $_.Name -notlike "*-setup.exe" -and $_.Name -notlike "uninstall*" } |
            Select-Object -First 1
          if (-not $exe) { throw "Release executable not found" }
          Copy-Item $exe.FullName "$portableDir/SoundCloud Mod.exe"
          @"
          SoundCloud Mod v$version (Windows x64 Portable)
          ===============================================
          Run "SoundCloud Mod.exe" directly — no installation required.
          Requires Microsoft Edge WebView2 Runtime (pre-installed on Windows 11 and modern Windows 10).
          "@ | Set-Content -Path "$portableDir/README-PORTABLE.txt" -Encoding UTF8
          # One naming scheme; GitHub lists assets by name, so "installer" comes first.
          $out = "release-assets/soundcloud-mod-$version"
          $bundle = "desktop/src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "$portableDir/*" -DestinationPath "$out-portable-windows-x64.zip" -Force
          $setup = Get-ChildItem "$bundle/nsis/*-setup.exe" | Select-Object -First 1
          Copy-Item $setup.FullName "$out-installer-windows-x64.exe"
          # Updater signatures stay out of the release: only latest.json needs them.
          New-Item -ItemType Directory -Force -Path "sigs" | Out-Null
          Copy-Item "$($setup.FullName).sig" "sigs/soundcloud-mod-$version-installer-windows-x64.exe.sig"
          Copy-Item (Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1).FullName "$out-windows-x64.msi"

      # Tauri links .DirIcon to an absolute build-machine path, so it dangles inside the AppImage
      # and the AppImage catalog rejects it. Replace the link with the real PNG and repack.
      - name: Fix AppImage .DirIcon
        if: matrix.job_name == 'ubuntu'
        working-directory: desktop/src-tauri/target/release/bundle/appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          for img in *.AppImage; do
            "./$img" --appimage-extract > /dev/null
            icon=$(grep -m1 '^Icon=' squashfs-root/*.desktop | cut -d= -f2)
            cp --remove-destination "squashfs-root/$icon.png" squashfs-root/.DirIcon
            test -s squashfs-root/.DirIcon
            # Extract + repack can drop the exec bit; the catalog then can't start AppRun.
            chmod +x squashfs-root/AppRun squashfs-root/usr/bin/*
            ls -l squashfs-root/AppRun squashfs-root/usr/bin
            "$RUNNER_TEMP/appimagetool" squashfs-root "$img"
            rm -rf squashfs-root "$img.sig"
            # Repacking changed the bytes, so the updater signature has to be made again.
            "$GITHUB_WORKSPACE/desktop/node_modules/.bin/tauri" signer sign "$img"
            test -s "$img.sig"
          done

      - name: Stage Ubuntu release assets
        if: matrix.job_name == 'ubuntu'
        run: |
          version=$(jq -r .version desktop/package.json)
          out="release-assets/soundcloud-mod-$version-linux"
          bundle=desktop/src-tauri/target/release/bundle
          mkdir -p release-assets
          cp $bundle/deb/*.deb "$out-amd64.deb"
          # The AppImage catalog asks for no "linux" in AppImage names.
          cp $bundle/appimage/*.AppImage "release-assets/soundcloud-mod-$version-x86_64.AppImage"
          mkdir -p sigs
          cp $bundle/appimage/*.AppImage.sig "sigs/soundcloud-mod-$version-x86_64.AppImage.sig"
          cp $bundle/rpm/*.rpm "$out-x86_64.rpm"

      - name: Keep updater signatures for latest.json
        uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: sigs-${{ matrix.job_name }}
          path: sigs/*.sig

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*

  # Release notes = the annotated tag message (hand-written intro, optional) + commit subjects
  # since the previous v* tag. The in-app updater reads latest.json from the newest release;
  # it is built from the build jobs' signatures, so the repacked AppImage gets its final one.
  release-notes-and-manifest:
    name: Release notes and updater manifest
    needs: build-and-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write release notes
        run: |
          tag="$GITHUB_REF_NAME"
          # checkout can turn the annotated tag into a lightweight one; fetch it back.
          git fetch --force --tags -q
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          range=${prev:+$prev..}$tag
          section() { # $1 = title, $2 = commit type regex
            lines=$(git log "$range" --no-merges --format=%s | grep -E "^($2)(\(|:)" \
              | sed -E 's/^[a-z]+(\([a-z0-9-]+\))?: /- /' | awk '!seen[$0]++')
            [ -n "$lines" ] && printf '### %s\n\n%s\n\n' "$1" "$lines"
            true
          }
          {
            section 'Новое' feat
            section 'Внешний вид' style
            section 'Исправления' fix
            section 'Быстрее' perf
          } > changes.md
          # With a hand-written intro the English commit list folds away under it.
          if [ "$(git cat-file -t "$tag")" = tag ]; then
            git tag -l --format='%(contents)' "$tag" > whats-new.md
          fi
          # No picture of its own (a patch): lead with the README banner, like the app does.
          banner="![SoundCloud Mod](https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/docs/banner.webp)"
          if [ -s whats-new.md ] && ! grep -q '!\[' whats-new.md; then
            { head -n 1 whats-new.md; echo; echo "$banner"; tail -n +2 whats-new.md; } > wn.tmp
            mv wn.tmp whats-new.md
          fi
          {
            if [ -s whats-new.md ]; then
              cat whats-new.md
              printf '\n<details>\n<summary>Все изменения по коммитам (на английском)</summary>\n\n'
              cat changes.md
              printf '</details>\n\n'
            else
              cp changes.md whats-new.md
              cat changes.md
            fi
            cat <<'EOF'
          ### Какой файл скачать

          **Windows:** `installer-windows-x64.exe` — обычная установка, дальше приложение
          обновляется само. `portable-windows-x64.zip` — без установки, обновлять вручную.
          `.msi` — для развёртывания на нескольких компьютерах.

          **Linux:** `.AppImage` (обновляется само), `.deb` для Ubuntu/Debian, `.rpm` для
          Fedora/openSUSE.
          EOF
            [ -n "$prev" ] && printf '\n[Все изменения](https://github.com/%s/compare/%s...%s)\n' \
              "$GITHUB_REPOSITORY" "$prev" "$tag"
            true
          } > notes.md
          cat notes.md
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --notes-file notes.md

      - uses: actions/download-artifact@v4
        with:
          pattern: sigs-*
          path: sigs
          merge-multiple: true

      - name: Publish latest.json
        run: |
          tag="$GITHUB_REF_NAME"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          entry() {
            sig=$(ls sigs/$1 | head -1)
            jq -n --arg s "$(cat "$sig")" --arg u "$base/$(basename "${sig%.sig}")" \
              '{signature: $s, url: $u}'
          }
          win=$(entry '*-installer-windows-x64.exe.sig')
          linux=$(entry '*.AppImage.sig')
          jq -n --arg v "${tag#v}" --arg d "$(date -u +%FT%TZ)" --rawfile n whats-new.md \
            --argjson win "$win" --argjson linux "$linux" \
            '{version: $v, notes: $n, pub_date: $d, platforms: {
              "windows-x86_64": $win, "windows-x86_64-nsis": $win,
              "linux-x86_64": $linux, "linux-x86_64-appimage": $linux}}' > latest.json
          cat latest.json
          gh release upload "$tag" latest.json -R "$GITHUB_REPOSITORY" --clobber

  # Keep package.json on main at the released version, so dev builds and the next release agree.
  bump-version:
    name: Write version back to main
    needs: release-notes-and-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Commit version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "$(jq -r .version desktop/package.json)" = "$v" ] && exit 0
          jq --arg v "$v" '.version = $v' desktop/package.json > pkg.tmp
          mv pkg.tmp desktop/package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: release v$v"
          git push
