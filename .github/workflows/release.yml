name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build (${{ matrix.job_name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis,msi"
            job_name: windows
          - platform: ubuntu-22.04
            args: "--bundles deb,appimage,rpm"
            job_name: ubuntu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: matrix.job_name == 'ubuntu'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            patchelf \
            rpm \
            squashfs-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: release-${{ matrix.job_name }}

      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: desktop
          args: ${{ matrix.args }}

      - name: Package Windows Portable ZIP
        if: matrix.job_name == 'windows'
        shell: pwsh
        run: |
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $portableDir = "portable-staging"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          $exe = Get-ChildItem -Path "desktop/src-tauri/target/release" -Filter "*.exe" |
            Where-Object { $_.Name -notlike "*-setup.exe" -and $_.Name -notlike "uninstall*" } |
            Select-Object -First 1
          if (-not $exe) { throw "Release executable not found" }
          Copy-Item $exe.FullName "$portableDir/SoundCloud Mod.exe"
          @"
          SoundCloud Mod v$version (Windows x64 Portable)
          ===============================================
          Run "SoundCloud Mod.exe" directly — no installation required.
          Requires Microsoft Edge WebView2 Runtime (pre-installed on Windows 11 and modern Windows 10).
          "@ | Set-Content -Path "$portableDir/README-PORTABLE.txt" -Encoding UTF8
          New-Item -ItemType Directory -Force -Path "release-assets" | Out-Null
          Compress-Archive -Path "$portableDir/*" -DestinationPath "release-assets/SoundCloud-Mod-v$version-windows-x64-portable.zip" -Force
          Copy-Item "desktop/src-tauri/target/release/bundle/nsis/*.exe" "release-assets/" -Force
          Copy-Item "desktop/src-tauri/target/release/bundle/msi/*.msi" "release-assets/" -Force

      # Tauri links .DirIcon to an absolute build-machine path, so it dangles inside the AppImage
      # and the AppImage catalog rejects it. Replace the link with the real PNG and repack.
      - name: Fix AppImage .DirIcon
        if: matrix.job_name == 'ubuntu'
        working-directory: desktop/src-tauri/target/release/bundle/appimage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          ARCH: x86_64
        run: |
          wget -q https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -O "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          for img in *.AppImage; do
            "./$img" --appimage-extract > /dev/null
            icon=$(grep -m1 '^Icon=' squashfs-root/*.desktop | cut -d= -f2)
            cp --remove-destination "squashfs-root/$icon.png" squashfs-root/.DirIcon
            test -s squashfs-root/.DirIcon
            "$RUNNER_TEMP/appimagetool" squashfs-root "$img"
            rm -rf squashfs-root
          done

      - name: Stage Ubuntu release assets
        if: matrix.job_name == 'ubuntu'
        run: |
          mkdir -p release-assets
          cp desktop/src-tauri/target/release/bundle/deb/*.deb release-assets/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cp desktop/src-tauri/target/release/bundle/rpm/*.rpm release-assets/

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: release-assets/*
          generate_release_notes: true
