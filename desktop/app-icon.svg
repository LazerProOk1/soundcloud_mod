<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FF3D00"/>
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#shine)"/>

  <!-- Waveform pills and a cloud built from circles, all on one flat baseline (y=650).
       The pills stop short of the cloud, so nothing overlaps or peeks out. -->
  <g transform="translate(7, 32)" fill="#FFFFFF">
    <rect x="120" y="550" width="44" height="100" rx="22"/>
    <rect x="182" y="500" width="44" height="150" rx="22"/>
    <rect x="244" y="450" width="44" height="200" rx="22"/>
    <rect x="306" y="400" width="44" height="250" rx="22"/>
    <rect x="368" y="350" width="44" height="300" rx="22"/>

    <circle cx="530" cy="560" r="90"/>
    <circle cx="650" cy="470" r="160"/>
    <circle cx="780" cy="540" r="110"/>
    <rect x="530" y="500" width="250" height="150"/>
  </g>
</svg>
