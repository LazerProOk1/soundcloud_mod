<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FF3D00"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.3" cy="0.22" r="0.7">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Orange gradient square with a soft shine from the top left. -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#shine)"/>

  <!-- Five evenly spaced waveform bars growing towards the cloud, with the cloud right after the
       last one. Nothing overlaps, so no bar peeks out over the cloud. Centred on the canvas. -->
  <g transform="translate(140 300)" fill="#FFFFFF">
    <ellipse cx="21" cy="200" rx="22" ry="80"/>
    <ellipse cx="95" cy="200" rx="22" ry="120"/>
    <ellipse cx="169" cy="200" rx="22" ry="155"/>
    <ellipse cx="243" cy="200" rx="22" ry="185"/>
    <ellipse cx="317" cy="200" rx="22" ry="200"/>
    <path d="M380 390 L380 110 Q383 62 429 52 Q465 44 491 72 Q507 36 547 28 Q611 16 651 62
             Q691 96 683 152 Q721 160 735 196 Q755 248 725 296 Q695 344 643 352 Z"/>
  </g>
</svg>
